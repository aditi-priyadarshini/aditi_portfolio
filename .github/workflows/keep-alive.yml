name: Keep Supabase Alive

on:
  schedule:
    # Every 3 days at 06:00 UTC. Well inside the 7-day pause window
    # even if a run or two gets skipped by GitHub under load.
    - cron: '0 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sanity-check secrets exist
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ]; then
            echo "::error::SUPABASE_URL secret is empty or not set"; exit 1
          fi
          if [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "::error::SUPABASE_ANON_KEY secret is empty or not set"; exit 1
          fi

      - name: Ping Supabase (read)
        run: |
          # Strip any trailing slash so we never build a // URL
          URL="$(echo "${{ secrets.SUPABASE_URL }}" | sed 's:/*$::')"

          STATUS=$(curl -s -o /tmp/body.txt -w "%{http_code}" \
            "$URL/rest/v1/profile?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")

          echo "HTTP $STATUS"
          cat /tmp/body.txt

          if [ "$STATUS" != "200" ]; then
            echo "::error::Ping failed with HTTP $STATUS - the DB was NOT touched"
            exit 1
          fi

      - name: Ping Supabase (write)
        run: |
          URL="$(echo "${{ secrets.SUPABASE_URL }}" | sed 's:/*$::')"

          STATUS=$(curl -s -o /tmp/w.txt -w "%{http_code}" -X POST \
            "$URL/rest/v1/keep_alive" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"note":"github-actions"}')

          echo "HTTP $STATUS"
          cat /tmp/w.txt

          case "$STATUS" in
            200|201|204) echo "Write OK" ;;
            *) echo "::error::Write ping failed with HTTP $STATUS"; exit 1 ;;
          esac

      # Keeps the repo "active" so GitHub never disables this schedule.
      - name: Bump activity timestamp
        run: |
          mkdir -p .keepalive
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive/last-run.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .keepalive/last-run.txt
          git commit -m "chore: keep-alive ping [skip ci]" || exit 0
          git push
